<filters-header headerTitle="CDR3" headerHelp="<p>Narrow search to a specific CDR3 motif or sequence different by no more than the specified number of mismatches from the query.</p>
<p>Sequence and pattern filter supports 20 amino acids, X for an unknown amino acid and amino acid groups specified with '[.]'. For example 'CASSL[ASR]PGATNEKLFF' will search
for 'CASSLaPGATNEKLFF', 'CASSLsPGATNEKLFF' and 'CASSLrPGATNEKLFF'. By default the search expects full match, which can be disabled by checking the substring checkbox.</p>
<p>Levenshtein distance filter expects complete sequence with no wildcards, and lets you specify the number of substitutions, insertions and deletions allowed during the
search. No more than 5 edits in total, since the search cost grows combinatorially with that number.</p>">
</filters-header>
<div class="ui grid middle aligned">
    <div class="three wide column filters label"><b>Sequence or pattern</b></div>
    <div class="twelve wide column">
        <div class="ui right labeled fluid input" [ngClass]="{'error':!tcr.cdr3.isPatternValid()}">
            <input placeholder="Amino acid pattern, e.g. CSAR[DE]GTGNGYTF or CSARDXTGNGYTF."
                   type="text" [ngModel]="tcr.cdr3.pattern" (ngModelChange)="tcr.cdr3.checkPattern($event)">
            <div class="ui basic label">
                <div class="ui checkbox">
                    <input [(ngModel)]="tcr.cdr3.patternSubstring" type="checkbox">
                    <label>Substring</label>
                </div>
            </div>
        </div>
    </div>
    <div class="three wide column filters label"><b>CDR3 Length</b></div>
    <div class="eleven wide column">
        <slider [min]="tcr.cdr3.lengthMin" [max]="tcr.cdr3.lengthMax" [(model)]="tcr.cdr3.length"></slider>
    </div>
    <div class="three wide column filters label"> <b>By Levenshtein distance</b></div>
    <div class="twelve wide column">
        <div class="ui fluid input" [ngClass]="{'error':!tcr.cdr3.isLevenshteinValid()}">
            <input placeholder="Complete amino acid sequence, e.g. CASSLAPGATNEKLFF." [ngModel]="tcr.cdr3.levenshtein" (ngModelChange)="tcr.cdr3.checkLevenshtein($event)">
        </div>
    </div>
    <div class="three wide column"></div>
    <!-- The `max` attributes are bound to the remaining shared budget, not to the per-field ceiling,
         so the browser's own spinner arrows stop where the budget does. -->
    <div class="three wide column">
        Substitutions
        <div class="ui fluid input">
            <input min="0" [attr.max]="tcr.cdr3.getRemainingBudgetFor(tcr.cdr3.levenshteinSubstitutions, 5)" type="number"
                   [ngModel]="tcr.cdr3.levenshteinSubstitutions" (ngModelChange)="checkRangeInput('levenshteinSubstitutions', $event, 0, 5)">
        </div>
    </div>
    <div class="three wide column">
        Insertions
        <div class="ui fluid input">
            <input min="0" [attr.max]="tcr.cdr3.getRemainingBudgetFor(tcr.cdr3.levenshteinInsertions, 3)" type="number"
                   [ngModel]="tcr.cdr3.levenshteinInsertions" (ngModelChange)="checkRangeInput('levenshteinInsertions', $event, 0, 3)">
        </div>
    </div>
    <div class="three wide column">
        Deletions
        <div class="ui fluid input">
            <input min="0" [attr.max]="tcr.cdr3.getRemainingBudgetFor(tcr.cdr3.levenshteinDeletions, 3)" type="number"
                   [ngModel]="tcr.cdr3.levenshteinDeletions" (ngModelChange)="checkRangeInput('levenshteinDeletions', $event, 0, 3)">
        </div>
    </div>
    <div class="three wide column" header="Total edits"
         popup="No more than 5 edits maximum, counting substitutions, insertions and deletions together. A wider search grows
combinatorially and can take minutes to answer.">
        <b>Total</b>
        <div class="ui fluid input" [ngClass]="{'error':tcr.cdr3.isEditBudgetExhausted()}">
            <input type="text" readonly [value]="tcr.cdr3.getTotalEdits()">
        </div>
    </div>
</div>
