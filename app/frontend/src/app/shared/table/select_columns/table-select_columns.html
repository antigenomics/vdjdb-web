<div class="ui right floated compact menu" *ngIf="hasColumns()">
    <div class="ui simple dropdown item">
        Columns
        <i class="dropdown icon"></i>
        <div class="menu">
            <div class="header">
                <i class="columns icon"></i>
                Show
            </div>
            <a class="item" *ngFor="let descriptor of getSelectableColumns()"
               (click)="toggle(descriptor.name)">
                <i class="check circle outline icon" *ngIf="!isHidden(descriptor.name)"></i>
                <i class="circle outline icon" *ngIf="isHidden(descriptor.name)"></i>
                {{ getColumnTitle(descriptor.name) }}
            </a>
        </div>
    </div>
</div>
