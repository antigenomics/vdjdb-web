<div class="ui grid fade slow element">
    <div class="twelve wide column" style="height: 700px">
        <bar-chart-grouped [configuration]="barChartConfiguration" [stream]="stream"></bar-chart-grouped>
    </div>
    <!-- Only the species actually plotted, so the key does not list viruses that are not on screen. -->
    <div class="twelve wide column chart-legend" *ngIf="getSpeciesLegend().length !== 0">
        <span class="chart-legend__entry" *ngFor="let entry of getSpeciesLegend()">
            <i class="chart-legend__swatch" [style.background-color]="entry.color"></i>{{ entry.name }}
        </span>
    </div>
    <div class="four wide column">
        <h4 class="ui header"><i class="low vision icon"></i>Hide samples</h4>
        <div class="ui divider"></div>
        <!-- A sample with nothing to plot has no panel to hide, so its chip is inert rather than a
             control that silently does nothing. -->
        <button class="ui tiny compact teal button" style="margin: 2px" *ngFor="let sample of getCurrentTabProcessedSamples()"
                [ngClass]="{'basic':isSampleHidden(sample) || isSampleEmpty(sample), 'disabled':isSampleEmpty(sample)}"
                [attr.title]="isSampleEmpty(sample) ? 'No matches under the current column and cutoff - nothing to plot for this sample' : null"
                (click)="toggleSampleHidden(sample)">
            {{ sample }}
        </button>
        <h4 class="ui header"><i class="options icon"></i>Options</h4>
        <div class="ui divider"></div>
        <div class="ui checkbox" [ngClass]="{'disabled':order}">
            <!-- Ordering by samples overrides the per-tag colouring, so the checkbox must actually be
                 inert while `order` is set - the wrapper only looked disabled and still toggled. -->
            <input type="checkbox" [(ngModel)]="tagsColors" [disabled]="order">
            <label>Color by tags</label>
        </div>
        <br>
        <div class="ui checkbox">
            <input type="checkbox" [(ngModel)]="order">
            <label>Order by samples</label>
        </div>
        <br>
        <div class="ui checkbox">
            <input type="checkbox" [(ngModel)]="shared" [disabled]="order">
            <label>Show shared only</label>
        </div>
        <br>
        <div class="ui checkbox">
            <input type="checkbox" [(ngModel)]="logarithmic">
            <label>Logarithmic axis</label>
        </div>
        <br>
        <!-- Inert unless the epitope column is selected: every other column's values span species, so
             there is no one species to colour a bar by. -->
        <div class="ui checkbox" [ngClass]="{'disabled':!isSpeciesColoringAvailable()}">
            <input type="checkbox" [(ngModel)]="speciesColors" [disabled]="!isSpeciesColoringAvailable()">
            <label>Color by epitope species</label>
        </div>
        <div class="ui divider"></div>
        <summary-chart-options [options]="getCurrentTabSummaryChartOptions()"
                               [disableCheckboxes]="getCurrentTabSummaryChartDisableCheckboxesOptions()"
                               (onOptionsChange)="handleChangeOptionsFn($event)"
                               [threshold]="threshold"></summary-chart-options>
    </div>
</div>
