<div class="ui horizontal divider">
    Source filters
</div>
<div class="ui grid">
    <div class="ui row middle aligned">
        <div class="two wide column filters label"><b>Species</b></div>
        <div class="five wide column">
            <div class="ui fluid selection dropdown" [ngClass]="{'disabled':disabled}" dropdown [content]="speciescontent">
                <span class="text">{{ filters.databaseQueryParams.species }}</span>
                <i class="dropdown icon"></i>
                <div class="menu fast fade element" #speciescontent>
                    <div class="item" (click)="filters.databaseQueryParams.species='HomoSapiens'">HomoSapiens</div>
                    <div class="item" (click)="filters.databaseQueryParams.species='MacacaMulatta'">MacacaMulatta</div>
                    <div class="item" (click)="filters.databaseQueryParams.species='MusMusculus'">MusMusculus</div>
                </div>
            </div>
        </div>
    </div>
    <div class="ui row middle aligned">
        <div class="two wide column filters label"><b>Gene</b></div>
        <div class="five wide column">
            <div class="ui fluid selection dropdown" [ngClass]="{'disabled':disabled}" dropdown [content]="genecontent">
                <span class="text">{{ filters.databaseQueryParams.gene }}</span>
                <i class="dropdown icon"></i>
                <div class="menu fast fade element" #genecontent>
                    <div class="item" (click)="filters.databaseQueryParams.gene='TRA'">TRA</div>
                    <div class="item" (click)="filters.databaseQueryParams.gene='TRB'">TRB</div>
                </div>
            </div>
        </div>
        <div class="one wide column"></div>
        <div class="four wide column filters label"><b>Chart epitope cutoff</b></div>
        <div class="four wide column">
            <!-- Annotations filters help: chart epitope cutoff -->
            <i class="fitted filters corner help icon"
               popup="Leaves epitopes VDJdb has fewer than this many records for off the summary charts, so rare epitopes do not crowd them. Affects the plots only - every match still appears in the results table, and this does not change what is searched."
               header="Chart epitope cutoff"
               footer="Default is 10; 0 charts everything">
            </i>
            <div class="ui input fluid">
                <input [attr.disabled]="isDisabled()" type="number" min="0" max="1000" [ngModel]="filters.databaseQueryParams.minEpitopeSize"
                       (ngModelChange)="checkMinEpitopeSize($event)">
            </div>
        </div>
    </div>
    <div class="ui row middle aligned">
        <div class="two wide column filters label"><b>MHC</b></div>
        <div class="five wide column">
            <div class="ui fluid selection dropdown" [ngClass]="{'disabled':disabled}" dropdown [content]="mhccontent">
                <span class="text">{{ filters.databaseQueryParams.mhc }}</span>
                <i class="dropdown icon"></i>
                <div class="menu fast fade element" #mhccontent>
                    <div class="item" (click)="filters.databaseQueryParams.mhc='MHCI'">MHCI</div>
                    <div class="item" (click)="filters.databaseQueryParams.mhc='MHCII'">MHCII</div>
                    <div class="item" (click)="filters.databaseQueryParams.mhc='MHCI+II'">MHCI+II</div>
                </div>
            </div>
        </div>
    </div>
    <div class="ui row middle aligned">
        <div class="two wide column filters label"><b>Donor HLA</b></div>
        <div class="ten wide column">
            <!-- Annotations filters help: donor HLA-->
            <i class="fitted filters corner help icon"
               popup="Restrict matches to epitopes presented by this donor's HLA. Accepts a list, e.g. HLA-A*02:01, B*07:02, DRB1*15:01. A record typed at lower resolution than the donor still matches (HLA-A*02:01 matches an HLA-A*02 record), but HLA-A*02:01 and HLA-A*02:05 do not match each other."
               header="Donor HLA typing"
               footer="Leave blank to allow all HLAs">
            </i>
            <div class="ui input fluid">
                <input [attr.disabled]="isDisabled()" type="text" placeholder="Leave blank to allow all HLAs"
                       [(ngModel)]="filters.databaseQueryParams.hla">
            </div>
        </div>
    </div>
</div>

<div class="ui horizontal divider">
    Evidence
</div>
<div class="ui grid">
    <div class="ui row middle aligned">
        <div class="two wide column filters label"><b>Supported by</b></div>
        <div class="ten wide column">
            <!-- Annotations filters help: evidence filters-->
            <i class="fitted filters corner help icon"
               popup="Restrict matches to VDJdb records supported by the selected kinds of evidence. Ticking several of these narrows the result: a match has to satisfy every one that is ticked. TCREMP and TCRNET motifs are clusters of similar receptors recognising the same epitope, as shown on the Motif page."
               header="Supporting evidence"
               footer="Only TCREMP motif membership is on by default">
            </i>
            <div class="ui checkbox">
                <input [attr.disabled]="isDisabled()" type="checkbox" [(ngModel)]="filters.databaseQueryParams.inTcrempMotif">
                <label>In TCREMP motif</label>
            </div>
            <br>
            <div class="ui checkbox">
                <input [attr.disabled]="isDisabled()" type="checkbox" [(ngModel)]="filters.databaseQueryParams.inTcrnetMotif">
                <label>In TCRNET motif</label>
            </div>
            <br>
            <div class="ui checkbox">
                <input [attr.disabled]="isDisabled()" type="checkbox" [(ngModel)]="filters.databaseQueryParams.independentValidationOnly">
                <label>Only independently validated</label>
            </div>
            <br>
            <div class="ui checkbox">
                <input [attr.disabled]="isDisabled()" type="checkbox"
                       [ngModel]="filters.databaseQueryParams.minConfidenceScore > 0"
                       (ngModelChange)="filters.databaseQueryParams.minConfidenceScore = $event ? 1 : 0">
                <label>Assay confidence score &ge; 1</label>
            </div>
        </div>
    </div>
</div>
