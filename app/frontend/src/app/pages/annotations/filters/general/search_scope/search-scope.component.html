<div class="ui horizontal divider">
    Search scope
</div>
<div class="ui grid">
    <div class="ui row middle aligned">
        <div class="four wide column filters label"><b>Segment match rule</b></div>
        <div class="five wide column">
            <div class="ui checkbox">
                <input [attr.disabled]="isDisabled()" type="checkbox" [(ngModel)]="filters.searchScope.matchV">
                <label>Match V</label>
            </div>
            <br>
            <div class="ui checkbox">
                <input [attr.disabled]="isDisabled()" type="checkbox" [(ngModel)]="filters.searchScope.matchJ">
                <label>Match J</label>
            </div>
        </div>
    </div>
    <div class="ui row middle aligned">
        <div class="four wide column filters label">
            <b>Edit distance</b>
            <i class="filters help icon" popup
               popup="Exact matches the CDR3 as written. Hamming allows substitutions and keeps the CDR3 length fixed. Levenshtein allows one edit of any kind - a substitution, an insertion or a deletion - so it also matches CDR3s one residue longer or shorter."
               header="Edit distance"
               footer="Wider searches match more records and take longer">
            </i>
        </div>
        <div class="five wide column">
            <div class="ui radio checkbox">
                <input [attr.disabled]="isDisabled()" type="radio" name="editDistance"
                       [checked]="isMode('exact')" (change)="setMode('exact')">
                <label>Exact</label>
            </div>
            <br>
            <div class="ui radio checkbox">
                <input [attr.disabled]="isDisabled()" type="radio" name="editDistance"
                       [checked]="isMode('hamming1')" (change)="setMode('hamming1')">
                <label>Hamming &le; 1</label>
            </div>
            <br>
            <div class="ui radio checkbox">
                <input [attr.disabled]="isDisabled()" type="radio" name="editDistance"
                       [checked]="isMode('hamming2')" (change)="setMode('hamming2')">
                <label>Hamming &le; 2</label>
            </div>
            <br>
            <div class="ui radio checkbox">
                <input [attr.disabled]="isDisabled()" type="radio" name="editDistance"
                       [checked]="isMode('levenshtein')" (change)="setMode('levenshtein')">
                <label>Levenshtein &le; 1</label>
            </div>
        </div>
    </div>
</div>
