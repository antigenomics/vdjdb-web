<div class="ui horizontal divider">
    Search scope
</div>
<div class="ui grid">
    <div class="ui row middle aligned">
        <div class="four wide column filters label"><b>Segment match rule</b></div>
        <div class="five wide column">
            <div class="ui checkbox">
                <input [attr.disabled]="isDisabled()" type="checkbox" [(ngModel)]="filters.searchScope.matchV">
                <label>Match V</label>
            </div>
            <br>
            <div class="ui checkbox">
                <input [attr.disabled]="isDisabled()" type="checkbox" [(ngModel)]="filters.searchScope.matchJ">
                <label>Match J</label>
            </div>
        </div>
    </div>
    <div class="ui row middle aligned">
        <div class="four wide column filters label">
            <b>Edit distance</b>
            <i class="filters help icon" popup
               popup="Hamming allows a single substitution and keeps the CDR3 length fixed. Levenshtein allows one edit of any kind - a substitution, an insertion or a deletion - so it also matches CDR3s one residue longer or shorter."
               header="Edit distance"
               footer="Levenshtein is the wider search and takes longer">
            </i>
        </div>
        <div class="five wide column">
            <div class="ui radio checkbox">
                <input [attr.disabled]="isDisabled()" type="radio" name="editDistance"
                       [checked]="!isLevenshtein()" (change)="setLevenshtein(false)">
                <label>Hamming &mdash; 1 substitution</label>
            </div>
            <br>
            <div class="ui radio checkbox">
                <input [attr.disabled]="isDisabled()" type="radio" name="editDistance"
                       [checked]="isLevenshtein()" (change)="setLevenshtein(true)">
                <label>Levenshtein &mdash; 1 substitution, insertion or deletion</label>
            </div>
        </div>
    </div>
</div>
