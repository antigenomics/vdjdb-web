<!-- Single pane: the General/Scoring tab strip is gone along with VDJMatch scoring, so there is
     nothing left to switch between. Scoring stays fixed at Simple. -->
<div class="ui grid stackable">
    <div class="row fade element">
        <div class="nine wide column">
            <database-query-params [filters]="filters" [disabled]="disabled"></database-query-params>
        </div>
        <div class="seven wide column">
            <search-scope [filters]="filters" [disabled]="disabled"></search-scope>
        </div>
    </div>
</div>
