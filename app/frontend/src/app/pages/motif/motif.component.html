<div class="ui main content text fade slow element soft-margin" style="padding-bottom: 75px">
    <div class="ui raised segments">
        <h3 class="ui top attached header" style="display: flex; align-items: center; padding-top: 6px; padding-bottom: 6px;">
            <span style="flex: 1">Paratope motifs</span>
            <div class="ui pagination menu" style="margin: 0; font-size: 0.9em;">
                <a class="item" [class.active]="getCurrentMethod() === 'tcrnet'" (click)="setMethod('tcrnet')">TCRNet</a>
                <a class="item" [class.active]="getCurrentMethod() === 'tcremp'" (click)="setMethod('tcremp')">TCREMP</a>
            </div>
        </h3>
        <div class="ui attached segment">
            <div class="ui active inverted dimmer" *ngIf="isEpitopesLoading() | async">
                <div class="ui text loader">Loading</div>
            </div>
            <div class="ui grid">
                <div class="ui five wide column">
                    <motif-search-util [metadata]="metadata | async" [options]="options | async" [selected]="selected | async"
                                       [cdr3SearchOptions]="cdr3SearchOptions | async"></motif-search-util>
                </div>
                <div class="ui eleven wide column" #EpitopesContainer>
                    <motif-epitopes *ngIf="isStateSearchTree() && contentReady" [options]="options | async" [epitopes]="epitopes | async"></motif-epitopes>
                    <motif-cdr3-clusters *ngIf="isStateSearchCDR3() && contentReady" [options]="options | async" [clusters]="clusters | async"></motif-cdr3-clusters>
                </div>
            </div>
        </div>
    </div>
</div>
