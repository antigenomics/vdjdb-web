<div class="ui segments with-options" style="margin-top: 10px">
    <h4 class="ui clearing segment header">
        <div class="content">
            {{ epitope.epitope }}
        </div>
        <div class="sub header">
            {{ meta.species }}&nbsp;&nbsp;>&nbsp;&nbsp;{{ meta.gene }}&nbsp;&nbsp;>&nbsp;&nbsp;{{ meta.mhcclass }}&nbsp;&nbsp;>&nbsp;&nbsp;{{ meta.mhca }}
        </div>
        <i class="ui small close icon options-icon" (click)="discard()" style="right: 10px"></i>
        <i class="ui small angle icon options-icon" [ngClass]="{'down': isHidden, 'up': !isHidden}" (click)="hide()" style="right: 40px"></i>
    </h4>
    <ng-container *ngIf="!isHidden">
        <div class="ui clearing segment overlay-controls">
            <div class="ui toggle checkbox overlay-toggle">
                <input type="checkbox" [checked]="overlayEnabled" (change)="toggleOverlay($event.target.checked)">
                <label>Overlay mode (beta)</label>
            </div>
            <div class="ui tiny warning message" *ngIf="overlayError">{{ overlayError }}</div>
            <div class="overlay-selection" *ngIf="overlayEnabled">
                <div class="overlay-selection__item" *ngFor="let cluster of epitope.clusters">
                    <label>
                        <input type="checkbox"
                               [checked]="isClusterSelected(cluster)"
                               [disabled]="isOverlayCheckboxDisabled(cluster)"
                               (change)="onOverlaySelectionChange(cluster, $event.target.checked)">
                        <span class="overlay-selection__label">
                            {{ cluster.clusterId }}
                            <span *ngIf="cluster.visualization?.kind !== 'html'" class="overlay-selection__label-note">(no HTML)</span>
                        </span>
                    </label>
                </div>
                <div class="overlay-selection__hint">Select up to {{ overlayLimit }} structures with HTML visualizations.</div>
            </div>
        </div>
        <div class="ui clearing segment" *ngIf="overlayEnabled; else regularClusterView">
            <div class="structure-overlay" *ngIf="overlayLayerList.length > 0; else overlayEmpty">
                <div class="structure-overlay__layer" *ngFor="let layer of overlayLayerList; let i = index"
                     [style.z-index]="overlayLayerList.length - i"
                     [style.opacity]="computeOverlayOpacity(i)">
                    <div [innerHTML]="layer.markup"></div>
                </div>
            </div>
            <ng-template #overlayEmpty>
                <div class="structure-empty-placeholder">Select structures from the list above to compare them.</div>
            </ng-template>
        </div>
        <ng-template #regularClusterView>
            <div class="ui clearing segment">
                <structure-epitope-cluster *ngFor="let cluster of epitope.clusters; trackBy: trackClusterBy" [cluster]="cluster"
                                           [isNormalized]="isNormalized"></structure-epitope-cluster>
            </div>
        </ng-template>
    </ng-container>
</div>
