<div class="ui main content fade slow element soft-margin" style="padding-bottom: 75px">
    <!-- `raised`, like every other page: design-system.css scopes the card radius and shadow to
         `.raised`, so Browse was the one page in the app rendering flat. -->
    <div class="ui raised segments">
        <h3 class="ui top attached header filters-header" style="cursor: pointer; display: flex; align-items: center;" (click)="toggleFilters()">
            <span style="flex: 1">Filters</span>
            <span class="filters-toggle" [class.filters-toggle--collapsed]="filtersCollapsed"
                  [title]="filtersCollapsed ? 'Show filters' : 'Hide filters'">
                <i class="chevron up icon"></i>
            </span>
        </h3>
        <div class="ui attached segment teal padded" *ngIf="!filtersCollapsed">
            <search-info></search-info>
        </div>
        <div class="ui attached secondary clearing segment" *ngIf="!filtersCollapsed">
            <!-- Basic, not blue: blue belongs to no palette this app uses, and two filled buttons side
                 by side read as two primary actions. Refreshing the table is the primary one, so it
                 keeps the brand fill and resetting steps back to an outline. -->
            <button class="ui basic button right floated" (click)="reset()">Reset filters</button>
            <button class="ui teal button left floated" [ngClass]="{'loading':isLoading()}" (click)="search()">Refresh table</button>
        </div>
    </div>
    <div class="ui raised segments">
        <h3 class="ui top attached header">Records</h3>
        <div class="ui attached teal blurring segment">
            <div class="ui inverted dimmer" [ngClass]="{'active':isLoading()}">
                <div class="ui large text loader top element">Updating</div>
            </div>
            <search-table [table]="table" [columns]="columns"></search-table>
        </div>
    </div>
</div>
