# This is the main configuration file for the application.
# ~~~~~

# Secret key
# ~~~~~
# The secret key is used to secure cryptographics functions.
#
# This must be changed for production, but we recommend not changing it in this file.
#
# See http://www.playframework.com/documentation/latest/ApplicationSecret for more details.
play.http.secret.key = "2sh8?@C_pHH2M1JXSchxdu=w;kEbgO_3EggRGyJM0YlrX:a;YJBsYhR56V0Nmi;X"
play.http.secret.key = ${?VDJDB_APPLICATION_SECRET}

play.http.errorHandler = "backend.controllers.ErrorsHandler"
play.http.session.cookie.secure = true

# The application languages
# ~~~~~
play.i18n.langs = ["en"]


# The application configuration

#Path to store application.log
loggerPath = ./logs

application {

  #TemporaryFileProvider configuration
  temporary {
    #Path to store temporary files
    path = "/tmp/vdjdb-temporary"
    #Specify the time during which the file is guaranteed to exist
    keep = 12 hours
    #Specify an interval for deleting expired temporary files
    interval = 12 hours
  }

  #VDJdb-db configuration
  database {
    #Specify if use local vdjdb-database or try to download latest release from github repository
    useLocal = true
    #Specify path to local vdjdb-database
    path = "database/"
  }

  #Pre-built Plotly motif chart HTML files (strictly separate from the database)
  motifCharts {
    path = "motif-charts/"
  }

  # Authorization configuration
  auth {

    #Common configuration
    common {
      # Path to store user's uploaded files
      uploadLocation = "/tmp/vdjdb/"
      # Enable default users feature
      enableDefaultUsers = true
      # Clear default users if exists
      clearDefaultUsers = false
      # Create default users with application startup
      createUsers = [{"login": "test", "email": "test@mail.com", "password": "123456", "permissionsID": "1"}]
    }

    #Temporary user configuration

    temporary {
      #Specify the number of *live* temporary users for one IP (expired ones are reaped, freeing slots).
      #Sized for a shared institutional NAT rather than a single person: a whole lab exits through one
      #address, so a low cap locks out colleagues rather than abusers. The real spend bound is the
      #per-account file quota, not the account count.
      maxForOneIP = 30
      #Specify the time during which the token for temporary user is guaranteed to be valid.
      #Measured from LAST_ACCESSED_ON, not CREATED_ON, so this is an idle window: an account that is
      #still being used is never reaped out from under its owner. Matches the retention window for
      #samples owned by temporary accounts (application.annotations.retention.keepTemporary).
      #
      #Short on purpose. E-mail verification is the gate on registered signup, so while the mail
      #provider is unavailable a token is the only way in and every visitor takes this path — which
      #makes this window, not the registered one, the thing bounding how much unattended state the
      #site accumulates. Raise it once registered signup works again.
      keep = 3 hours
      #Specify an interval for deleting invalid temporary users. Well under `keep`: a reaper that runs
      #less often than the window it enforces leaves expired accounts lying around for the difference.
      #Expiry itself does not depend on it — UserProvider.isTemporaryExpired is checked at login too.
      interval = 30 minutes
    }

    #Demo user configuration
    demo {
      enabled = true
      filesLocation = "/tmp/vdjdb/demo"
      login = "vdjdb@vdjdb-demo.com"
      password = "demo"
    }

    #Verification token configuration
    verification {
      #Is verification required or not
      required = true
      #Verification method (console or email)
      method = "console"
      #Verification server
      server = "http://localhost:9000/authorization"
      #Specify the time during which the token is guaranteed to be valid
      keep = 24 hours
      #Specify an interval for deleting expired tokens
      interval = 24 hours
    }

    #Session token configuration
    session {
      #Specify the time during which the token is guaranteed to be valid after last usage
      keep = 30 days
      #Specify an interval for checking for expired session tokens
      interval = 1 day
    }

    #Reset token configuration
    reset {
      #Specify the time during which the token is guaranteed to be valid
      keep = 24 hours
      #Specify an interval for deleting expired tokens
      interval = 24 hours
    }
  }

  #Annotations page configuration
  annotations {
    upload {
      maxFileSize = 64MiB

      # Decompression-bomb guard. maxFileSize above and the per-account quota both measure COMPRESSED
      # bytes, and a bomb is tiny compressed by construction, so neither can catch one — bound the
      # decompressed stream instead. Measured on the shipped demo samples, honest repertoire data
      # expands ~5x, so 100x is generous for real input while rejecting the 1000x+ pathological cases.
      maxDecompressedSize = 256MiB
      maxCompressionRatio = 100

      # Hard ceiling on clonotypes per sample, enforced while streaming so an over-long file is
      # rejected before it is materialised.
      #
      # NOTE this is below the larger of the two shipped demo samples (63,738 and 187,640 rows), so
      # that one can be downloaded from the demo account but no longer re-uploaded. Deliberate: the
      # cap is a load ceiling, and the demo files are served from disk rather than pushed through the
      # converter, so they are unaffected where they actually live. Raise it back toward 200000 if
      # real repertoires start being turned away.
      #
      # Per-account sample counts live in USER_PERMISSIONS (42 for registered accounts, see
      # conf/evolutions/default/7.sql), not here.
      maxClonotypesCount = 100000
    }

    # Retention sweeper for stored samples. Age is read from FILE_METADATA.CREATED_AT — SAMPLE_FILE
    # carries no timestamp of its own. DEMO and UNLIMITED accounts are exempt in code and are never
    # swept whatever these values say.
    retention {
      enabled = true

      # SHIPPED ON. In dry-run the sweeper logs, per sample, the account, name and age it would have
      # deleted, and removes nothing. Leave it on until a real run has been read in the logs and
      # looks right: sample deletion takes the files off disk as well as the rows out of the
      # database, and there is no undo.
      dryRun = true

      # How often a pass runs. 0 disables the schedule entirely. Has to be well under the shortest
      # window below, or that window is only enforced to within one interval.
      interval = 30 minutes

      # Windows per account type. Registered accounts keep six months; token accounts keep three
      # hours, matching application.auth.temporary.keep.
      #
      # The two are not measured the same way and cannot be: an account ages from LAST_ACCESSED_ON
      # (idle time) while a sample ages from FILE_METADATA.CREATED_AT (absolute). So a token user who
      # stays active past three hours keeps their session and loses their oldest uploads rather than
      # being logged out mid-analysis. That is the intended trade — the alternative, an absolute
      # account lifetime, cuts people off in the middle of a run.
      keepRegistered = 180 days
      keepTemporary = 3 hours

      # Floor on how old a sample can be treated as. One set to today gives everything already stored
      # a full window starting now, instead of expiring it the moment retention is switched on.
      #
      # Needed because this was switched on over an archive, not a fresh site: on production 1,375 of
      # 1,443 registered samples are older than 365 days, the oldest by eight years. Without a floor
      # the first pass is a near-total wipe. The alternative - rewriting CREATED_AT in the database -
      # has the same effect but destroys the only record of when the data arrived, and that column
      # also feeds export filenames.
      #
      # It delays ageing, it does not exempt: once the floor itself is further back than the window,
      # the samples expire normally. ISO-8601 instant; unset or unparseable means no floor.
      # ageFrom = "2026-07-21T00:00:00Z"
    }

    # Per-day ceilings on work started. Distinct from USER_PERMISSIONS.MAX_FILES_COUNT, which caps
    # what is stored at any instant and so is defeated by uploading and deleting in a loop, and from
    # play.filters.limits, which bounds a short request window rather than a day. Negative values
    # mean "no limit". DEMO and UNLIMITED accounts are exempt in code.
    quota {
      enabled = true

      uploadsPerDayRegistered = 100
      uploadsPerDayTemporary = 20
      # Keyed on the address resolved by RequestUtils.clientIp (the right-most untrusted hop), never
      # on a raw X-Forwarded-For. Sized for a shared institutional NAT, like maxForOneIP above.
      uploadsPerDayPerIP = 200

      annotationsPerDayRegistered = 100
      annotationsPerDayTemporary = 20
    }

    # Admission control for annotation runs. The quota above bounds work per day; this bounds work
    # happening at the same instant, which is the axis that decides whether the box stays responsive.
    scheduler {
      enabled = true

      # Four cores, and the search engine already fans a single annotation across all of them, so two
      # concurrent jobs ask for roughly eight threads on four. More than that and everyone's
      # annotation slows down together. Raise only alongside the core count.
      maxConcurrent = 2

      # Jobs beyond maxConcurrent wait here and are told their position. Past this depth they are
      # refused: a queue nobody is still waiting on when their turn arrives is worse than a refusal.
      maxQueue = 20

      # Per websocket connection. One tab, one annotation - clicking a second sample while the first
      # is running is a mistake, not a request for parallelism.
      maxPerConnection = 1
    }
  }

  # Analytics configuration
  analytics {
    enabled = true
    googleID = "G-VDZ94WML3R"
    googleID = ${?VDJDB_APPLICATION_ANALYTICS_GOOGLE_ID}
  }

}

# Router
# ~~~~~
# Define the Router object to use for this application.
# This router will be looked up first when the application is starting up,
# so make sure this is the entry point.
# Furthermore, it's assumed your route file is named properly.
# So for an application router like `my.application.Router`,
# you may need to define a router file `conf/my.application.routes`.
# Default to Routes in the root package (and conf/routes)
# play.http.router = my.application.Routes

# Database configuration
# ~~~~~
# By convention, the default datasource is named `default`
#
slick.dbs.default.profile = "slick.jdbc.H2Profile$"
slick.dbs.default.db.profile = "org.h2.Driver"
slick.dbs.default.db.url = "jdbc:h2:file:/tmp/vdjdb/default-db;DB_CLOSE_DELAY=-1"
play.evolutions.db.default.autoApply = true

# play.evolutions.enabled=false

fixedConnectionPool = 9
database.dispatcher {
  executor = "thread-pool-executor"
  throughput = 1
  thread-pool-executor {
    fixed-pool-size = ${fixedConnectionPool}
  }
}

play.modules {
  enabled += "play.filters.headers.SecurityHeadersModule"
  enabled += "play.filters.gzip.GzipFilterModule"
}

play.filters {

  enabled = [
    play.filters.csrf.CSRFFilter,
    play.filters.headers.SecurityHeadersFilter,
    play.filters.gzip.GzipFilter,
    backend.server.limit.RequestLimits
  ]

  headers {

    # The X-Frame-Options header. If null, the header is not set.
    frameOptions = null

    # The X-XSS-Protection header. If null, the header is not set.
    xssProtection = "1; mode=block"

    # The X-Content-Type-Options header. If null, the header is not set.
    contentTypeOptions = "nosniff"

    # The X-Permitted-Cross-Domain-Policies header. If null, the header is not set.
    permittedCrossDomainPolicies = "master-only"

    # Content-Security-Policy
    # You may want to change this for production environments.
    # In dev mode is used to allow Webpack Websockets for auto reloads
    //contentSecurityPolicy = "default-src 'self'"
    contentSecurityPolicy = null

    # The Referrer-Policy header. If null, the header is not set.
    referrerPolicy = "origin-when-cross-origin, strict-origin-when-cross-origin"

    # If true, allow an action to use .withHeaders to replace one or more of the above headers
    allowActionSpecificHeaders = false
  }

  gzip {

    contentType {

      # If non empty, then a response will only be compressed if its content type is in this list.
      whiteList = ["text/*", "application/javascript", "application/json"]

      # The black list is only used if the white list is empty.
      # Compress all responses except the ones whose content type is in this list.
      blackList = []
    }

    # The buffer size to use for gzipped bytes
    bufferSize = 8k

    # The maximum amount of content to buffer for gzipping in order to calculate the content length before falling back
    # to chunked encoding.
    chunkedThreshold = 100000k

  }

  limits {
    maxRequestsCount = 10000
    countClearInterval = 1 hour
    maxRequestsTime = 900000 # milliseconds
    timeClearInterval = 30 minutes
  }

}

play.http.session = {

  # The cookie name
  cookieName = "VDJDB_SESSION"

  # Whether the secure attribute of the cookie should be set to true.
  # Left false so local dev over plain http://localhost:9000 keeps working. PROD MUST SET THIS TO TRUE
  # in the server-side config file (/home/vdjdb/environment/application.conf) — editing it here has no
  # effect on prod, because -Dconfig.file replaces this file wholesale.
  # NB: `play.http.session.cookie.secure` near the top of this file is NOT a real Play key, and is in
  # any case overwritten by this object assignment; this is the setting that actually takes effect.
  secure = false
  secure = ${?VDJDB_APPLICATION_SESSION_SECURE}

  # The max age to set on the cookie.
  # If null, the cookie expires when the user closes their browser.
  # An important thing to note, this only sets when the browser will discard the cookie.
  maxAge = ${application.auth.session.keep}

  # Whether the HTTP only attribute of the cookie should be set to true
  httpOnly = true

  # The value of the SameSite attribute of the cookie. Set to null for no SameSite attribute.
  sameSite = "lax"

  # The domain to set on the session cookie
  # If null, does not set a domain on the session cookie.
  domain = null

  # The session path
  # Must start with /.
  path = ${play.http.context}

  jwt {
    # The JWT signature algorithm to use on the session cookie
    # uses 'alg' https://tools.ietf.org/html/rfc7515#section-4.1.1
    signatureAlgorithm = "HS256"

    # The time after which the session is automatically invalidated.
    # Use 'exp' https://tools.ietf.org/html/rfc7519#section-4.1.4
    expiresAfter = ${play.http.session.maxAge}

    # The amount of clock skew to accept between servers when performing date checks
    # If you have NTP or roughtime synchronizing between servers, you can enhance
    # security by tightening this value.
    clockSkew = 5 minutes

    # The claim key under which all user data is stored in the JWT.
    dataClaim = "data"
  }
}

parsers.formUrlEncoded.maxLength = 1024Mb

play.temporaryFile {
  reaper {
    enabled = true
    initialDelay = "5 minutes"
    interval = "30 seconds"
    olderThan = "30 minutes"
  }
}

play.mailer {
  host = "example.com"
  port = 587
  ssl = no
  tls = yes
  from = null
  user = null
  password = null
}

application.mailer {
  # Secret path segment for POST /api/mailjet/events/:token, where Mailjet posts delivery events.
  #
  # The endpoint is public and Mailjet signs nothing, so this string is the only thing standing between
  # the log and anyone who guesses the route. Unset (the shipped value) means the route 404s, which is
  # also what production gets until someone adds the key — the server-side config replaces this file
  # rather than merging with it.
  #
  # Generate one with `openssl rand -hex 16` and register the callback with Mailjet; keep it out of
  # this file on the server and pass it through the environment, like the SMTP credentials.
  #
  # No `= null` default on purpose: an optional substitution with nothing behind it leaves the key
  # genuinely absent, which is unambiguous, where a null is a value that several config readers choke
  # on rather than treat as missing.
  eventsToken = ${?VDJDB_MAILJET_EVENTS_TOKEN}
}
