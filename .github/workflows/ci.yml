name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Set up Java 8 for SBT / Scala
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: sbt

      # 3. Set up Node.js 11
      # GitHub runners no longer ship Node 11 by default, so we install it explicitly
      - name: Set up Node.js 11
        uses: actions/setup-node@v4
        with:
          node-version: '11'
          cache: 'yarn'
          cache-dependency-path: app/frontend/yarn.lock

      # 4. Install Yarn 1.x explicitly
      - name: Install Yarn
        run: |
          npm install -g yarn@1.22.19
          yarn --version

      # 5. Install SBT
      - name: Install sbt
        run: |
          sudo apt-get update
          sudo apt-get install -y sbt

      # 6. Verify toolchain
      - name: Verify tool versions
        run: |
          java -version
          node --version
          npm --version
          yarn --version
          sbt --version

      # 7. Build frontend + backend
      - name: Build application
        run: |
          sbt frontendInstallDependencies build

      # 8. Run tests
      - name: Run tests
        run: |
          sbt test

      # 9. Upload build artifact (optional but useful)
      - name: Upload server package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vdjdb-server
          path: target/universal/*.zip

