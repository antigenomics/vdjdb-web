name: Build (and Publish on tag)

on:
  push:
    branches: [ main, master ]
    tags:
      - "v*"
  pull_request:
    branches: [ main, master ]

jobs:
  build-publish:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout source
        uses: actions/checkout@v4

      # Set up Java 8 for SBT / Scala
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
          cache: sbt

      # Set up SBT
      - uses: sbt/setup-sbt@v1

      # Set up Node.js 11
      # GitHub runners no longer ship Node 11 by default, so we install it explicitly
      - name: Set up Node.js 11
        uses: actions/setup-node@v4
        with:
          node-version: '11'
          cache: 'yarn'
          cache-dependency-path: app/frontend/yarn.lock

      # Install Yarn 1.x explicitly
      - name: Install Yarn
        run: |
          npm install -g yarn@1.22.19
          yarn --version

      # Verify toolchain
      - name: Verify tool versions
        run: |
          java -version
          node --version
          npm --version
          yarn --version
          sbt --version

      # Build frontend + backend
      # The enrichment null. Not committed - ~65 MB of gzipped repertoires in a repo whose largest
      # tracked file is 40 KB - so it is fetched into conf/, which is on the application classpath.
      # Fails the build if unavailable: an image without it starts fine and silently shows no p-values.
      - name: Fetch control repertoires
        run: ./tools/fetch_control.sh

      - name: Build application
        run: |
          sbt frontendInstallDependencies build

      # Frontend unit tests. After the build, so node_modules is already installed. Headless
      # Chrome with the sandbox off, per test/frontend/karma.conf.js. Until now the runner was
      # misconfigured and scanned an empty directory, so nothing here had ever actually run.
      - name: Test frontend
        working-directory: app/frontend
        run: yarn test

      # `build` is packageBin in Universal, which never looks at src/test, so for a long time nothing
      # in CI compiled - let alone ran - the spec files in this repo.
      #
      # This runs them. It is only possible because test/resources/database/ holds a small VDJdb
      # fixture: BaseTestSpecWithApplication boots a real Guice application, and without a local
      # database that constructor downloads the whole of VDJdb over the network before the first
      # assertion. See SOURCES.md.
      - name: Run tests
        run: |
          sbt test

      # The only frontend logic in this repo that is checkable without a browser, and the one place a
      # silent numerical regression has actually happened: summing the Beta-Binomial tail forward from
      # k underflows to zero far below the mode, which returns *maximal* significance for the epitopes
      # a sample matched least. Plain node against exact rational reference values - there is no
      # frontend test runner here and this needs none.
      - name: Verify enrichment statistics
        run: |
          node app/frontend/scripts/verify-statistics.js

      # Upload build artifact (optional but useful)
      - name: Upload server package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vdjdb-server
          path: target/universal/*.zip

      # -------------------------------
      # Version check (TAG ONLY)
      # -------------------------------
      - name: Check numeric version matches sbt version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -e

          TAG="$GITHUB_REF_NAME"

          # Enforce basic tag shape: vX.Y.Z(-anything)?
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "Invalid tag format: $TAG"
            exit 1
          fi

          # Extract numeric core from tag
          TAG_NUMERIC=$(echo "$TAG" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "Tag numeric version: $TAG_NUMERIC"

          # Extract numeric core from sbt version
          SBT_VERSION=$(grep -E '^[[:space:]]*version[[:space:]]*:=.*"' build.sbt \
                          | head -n1 \
                          | sed -E 's/^[[:space:]]*version[[:space:]]*:= *"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          SBT_NUMERIC=$(echo "$SBT_VERSION" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "sbt numeric version: $SBT_NUMERIC"

          if [ "$TAG_NUMERIC" != "$SBT_NUMERIC" ]; then
            echo "Numeric version mismatch"
            echo "Tag: $TAG_NUMERIC"
            echo "sbt: $SBT_NUMERIC"
            exit 1
          fi

          echo "Numeric versions match"

      # -------------------------------
      # Docker publish (TAG ONLY)
      # -------------------------------
      - name: Log in to Docker Hub
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Docker image
        if: github.ref_type == 'tag'
        run: sbt Docker/publish
