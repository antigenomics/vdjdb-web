name: Dev Docker Publish (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag to publish'
        required: false
        default: 'dev'

jobs:
  dev-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Set up Node.js 11
        uses: actions/setup-node@v4
        with:
          node-version: '11'
          cache: 'yarn'
          cache-dependency-path: app/frontend/yarn.lock

      - name: Install Yarn
        run: |
          npm install -g yarn@1.22.19
          yarn --version

      - name: Build application
        run: sbt frontendInstallDependencies build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish dev Docker image
        run: sbt 'set Docker / version := "${{ github.event.inputs.tag }}"' Docker/publish
